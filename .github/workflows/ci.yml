name: Core candidate checks
on:
  push:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Install isolated browser test runtime
        run: npx playwright-core install --with-deps chromium
      - name: Browser protocol and DOM fixtures (no live platform requests)
        run: node --test tests/browser/*.test.js
        env:
          CORE_BROWSER_CHANNEL: chromium
      - run: npm run test:modules
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build pinned native XHS executor (Windows, no platform login)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./services/xhs-executor/build.ps1
      - run: npm run pack:check
      - name: Build candidate archive
        run: npm pack --ignore-scripts
      - name: Archive SHA-256
        shell: bash
        run: sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: core-alpha-${{ matrix.os }}
          path: |
            *.tgz
            SHA256SUMS

